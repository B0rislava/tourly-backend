<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="">
<head>
    <meta charset="UTF-8">
    <title>Reset Your Password</title>
</head>
<body style="font-family: Arial, sans-serif; line-height: 1.6; color: #333; background-color: #f9f9f9; padding: 20px;">
    <div style="max-width: 600px; margin: 0 auto; padding: 20px; background-color: #ffffff; border: 1px solid #ddd; border-radius: 10px; text-align: center;">
        <h2 style="color: #b76cd4ff;">Reset Your Password</h2>
        <p>We received a request to reset your Tourly password. Use the code below to continue:</p>

        <div style="background-color: #f4f4f4; padding: 15px; margin: 25px 0; border-radius: 8px; font-size: 32px; font-weight: bold; letter-spacing: 10px; color: #b76cd4ff;"
             th:text="${code}">
            123456
        </div>

        <p>This code will expire in 15 minutes.</p>
        <p>If you didn't request a password reset, you can safely ignore this email - your password will not change.</p>

        <hr style="border: 0; border-top: 1px solid #eee; margin: 20px 0;">

        <p style="font-size: 0.8em; color: #777;">© 2026 Tourly. All rights reserved.</p>
    </div>
</body>
</html>
